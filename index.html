    <svg class="overlay" id="overlay" viewBox="0 0 1280 853" preserveAspectRatio="xMidYMid meet" aria-label="Interaktywna warstwa heksów"></svg>
  </div>
  <div class="hud"><div class="pill" id="status">Kliknij dowolny heks na mapie.</div><div class="hint">Grafika mapy pozostaje bez zmian; heks jest tylko warstwą interakcji.</div></div>
</div>
<script>
const svg=document.getElementById('overlay'),status=document.getElementById('status');
const NS='http://www.w3.org/2000/svg';
const R=18, W=Math.sqrt(3)*R, H=2*R, yStep=1.5*R;
let selected=null;
function pts(cx,cy){let a=[];for(let i=0;i<6;i++){const ang=(60*i-30)*Math.PI/180;a.push((cx+R*Math.cos(ang)).toFixed(1)+','+(cy+R*Math.sin(ang)).toFixed(1));}return a.join(' ')}
let row=0;
for(let cy=R;cy<853-R;cy+=yStep,row++){
  const offset=(row%2)*W/2; let col=0;
  for(let cx=220+offset;cx<1270-R;cx+=W,col++){
    const p=document.createElementNS(NS,'polygon');p.setAttribute('points',pts(cx,cy));p.setAttribute('class','hex');p.dataset.row=row;p.dataset.col=col;
    p.addEventListener('click',()=>{if(selected)selected.classList.remove('sel');selected=p;p.classList.add('sel');status.textContent=`Wybrany heks: rząd ${+p.dataset.row+1}, kolumna ${+p.dataset.col+1}`;});svg.appendChild(p);
  }
}
document.getElementById('clear').addEventListener('click',()=>{if(selected)selected.classList.remove('sel');selected=null;status.textContent='Kliknij dowolny heks na mapie.'});
</script>
